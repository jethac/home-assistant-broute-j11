repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan
        entry: python scripts/secret_scan.py
        language: system
        pass_filenames: false
